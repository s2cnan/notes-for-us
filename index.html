  typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function'

function safeSessionGet(key) {
  try { return window.sessionStorage.getItem(key); }
  catch (error) { console.warn('Session storage unavailable:', error); return null; }
}
function safeSessionSet(key, value) {
  try { window.sessionStorage.setItem(key, value); }
  catch (error) { console.warn('Session storage unavailable:', error); }
}
function safeSessionRemove(key) {
  try { window.sessionStorage.removeItem(key); }
  catch (error) { console.warn('Session storage unavailable:', error); }
}
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[character]));
}
function dateLabel(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime())
    ? ''
    : date.toLocaleDateString(undefined,{
        month:'short',
        day:'numeric',
        year:'numeric'
      });
}

const SAMPLE_FOLDERS = [
  {

let db = null;
let storage = null;
let cloudError = '';

try {
  if (typeof firebase !== 'undefined') {
    if (!firebase.apps.length) firebase.initializeApp(CONFIG);
    db = firebase.firestore();

    try {
      storage = firebase.storage();
    } catch (error) {
      console.warn('Firebase Storage unavailable:', error);
    }

    cloudError = 'Firebase did not load. The app will use local preview mode.';
  }
} catch (error) {
  console.error('Firebase initialization failed:', error);
  cloudError = 'Firebase could not initialize. Running in this browser only.';
}

const state = {
  user:safeSessionGet('notes_user') || null,
  view:'home',
  notes:[],
  folders:[],
  photos:[],
  search:'',
  activeNoteId:null,
  activeFolderId:null,
  busy:false,
  unsubs:[],
  toastTimer:null
};

function toast(message) {
  const element = $('#toast');
  if (!element) return;
  element.textContent = message;
  element.hidden = false;
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => element.hidden = true, 3200);
}

function icon(name, size=17) {
  return `<i data-lucide="${esc(name)}" width="${size}" height="${size}" aria-hidden="true"></i>`;
}
function refreshIcons() {
  try {
    if (window.lucide) window.lucide.createIcons();
  } catch (error) {
    console.warn('Icons unavailable:', error);
  }
}

function persistLocal() {
  try {
    localStorage.setItem('notes_local_notes', JSON.stringify(state.notes));
    localStorage.setItem('notes_local_folders', JSON.stringify(state.folders));
    localStorage.setItem('notes_local_photos', JSON.stringify(state.photos));
  } catch (error) {
    console.warn('Local cache could not be saved:', error);
  }
}

function loadLocal() {
  try {
    state.notes = JSON.parse(localStorage.getItem('notes_local_notes') || 'null')
      || SAMPLE_NOTES.map(note => ({...note}));
    state.folders = JSON.parse(localStorage.getItem('notes_local_folders') || 'null')
      || SAMPLE_FOLDERS.map(folder => ({...folder}));
    state.photos = JSON.parse(localStorage.getItem('notes_local_photos') || '[]') || [];
  } catch (error) {
    console.warn('Local data unavailable:', error);
    state.notes = SAMPLE_NOTES.map(note => ({...note}));
    state.folders = SAMPLE_FOLDERS.map(folder => ({...folder}));
    state.photos = [];
  }
}

function isAdmin() {
  return state.user === 'Ronan' || state.user === 'Rhy';
}
function visibleNotes() {
  return state.notes.filter(note => isAdmin() || note.published === true);
}
function getFolder(id) {
  return state.folders.find(folder => folder.id === id);
}

function anniversary() {
  const start = new Date(2025, 4, 19, 0, 0, 0);
  const now = new Date();
  const elapsed = Math.max(0, Math.floor((now - start) / 86400000));
  let next = new Date(now.getFullYear(), 4, 19);

  if (next < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
    next = new Date(now.getFullYear() + 1, 4, 19);
  }

  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const nextDay = new Date(next.getFullYear(), next.getMonth(), next.getDate());
  const days = Math.ceil((nextDay - today) / 86400000);

  return {elapsed, days, nextYear:next.getFullYear()};
}

function render() {
  if (!state.user) {
    loginScreen();
    return;
  }

  let content = '';
  switch (state.view) {
    case 'home': content = homeView(); break;
    case 'notes': content = notesView(); break;
    case 'note-detail': content = noteDetailView(); break;
    case 'editor': content = editorView(); break;
    case 'folder-detail': content = folderDetailView(); break;
    case 'photos': content = photosView(); break;
    case 'folders': content = foldersView(); break;
    default:
      state.view = 'home';
      content = homeView();
  }
  shell(content);
}

async function writeDoc(collection, item) {
  if (db) {
    await db.collection(collection).doc(item.id).set(item);
    return;
  }

  const array = collection === 'notes' ? state.notes
    : collection === 'folders' ? state.folders
    : state.photos;
  const index = array.findIndex(entry => entry.id === item.id);
  if (index >= 0) array[index] = item;
  else array.unshift(item);
  persistLocal();
}

async function deleteDoc(collection, id) {
  if (db) {
    await db.collection(collection).doc(id).delete();
    return;
  }

  const array = collection === 'notes' ? state.notes
    : collection === 'folders' ? state.folders
    : state.photos;
  const index = array.findIndex(entry => entry.id === id);
  if (index >= 0) array.splice(index, 1);
  persistLocal();
}

function action(name) {
  if (name === 'logout') {
    state.user = null;
    safeSessionRemove('notes_user');
    state.view = 'home';
    render();
    return;
  }

  if (['home','notes','photos','folders'].includes(name)) {
    state.view = name;
    render();
    return;
  }

  if (name === 'new-note') {
    if (!isAdmin()) return toast('Log in to create notes.');
    state.activeNoteId = null;
    state.view = 'editor';
    render();
    return;
  }

  if (name === 'edit-note') {
    if (!isAdmin()) return;
    state.view = 'editor';
    render();
    return;
  }

  if (name === 'cancel-editor') {
    state.view = state.activeNoteId ? 'note-detail' : 'home';
    render();
    return;
  }

  if (name === 'new-folder') {
    if (!isAdmin()) return toast('Log in to create folders.');
    folderModal();
    return;
  }

  if (name === 'edit-folder') {
    if (!isAdmin()) return;
    folderModal(getFolder(state.activeFolderId));
    return;
  }

  if (name === 'delete-note') {
    deleteActiveNote();
    return;
  }

  if (name === 'upload-photo') {
    if (!isAdmin()) return toast('Log in to upload photos.');
    photoModal();
  }
}

async function deleteActiveNote() {
  const note = state.notes.find(item => item.id === state.activeNoteId);
  if (!note) return;
  if (!confirm(`Delete "${note.title || 'untitled'}"? This cannot be undone.`)) return;

  try {
    await deleteDoc('notes', note.id);
    state.activeNoteId = null;
    state.view = 'notes';
    toast('Note deleted.');
    render();
  } catch (error) {
    console.error(error);
    toast('Could not delete note. Check Firestore rules.');
  }
}

function photoModal() {
  modal(`
    <form id="photo-form" class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="serif text-2xl">add a memory</h2>
        <button type="button" id="close-modal" class="icon-btn">${icon('x')}</button>
      </div>
      <label>
        <span class="small-label">choose photo</span>
        <input class="field" name="file" type="file" accept="image/*" required>
      </label>
      <label>
        <span class="small-label">caption (optional)</span>
        <input class="field" name="caption" maxlength="180" placeholder="a little memory...">
      </label>
      <label>
        <span class="small-label">folder</span>
        <select class="field" name="folderId">
          <option value="">unfiled</option>
          ${state.folders.map(folder => `<option value="${esc(folder.id)}" ${state.activeFolderId === folder.id ? 'selected' : ''}>${esc(folder.name)}</option>`).join('')}
        </select>
      </label>
      <p class="text-[11px] text-stone-400">Uploads need Firebase Storage enabled and valid Storage rules.</p>
      <div class="flex gap-2">
        <button type="button" id="cancel-modal" class="btn btn-white flex-1">cancel</button>
        <button type="submit" id="upload-submit" class="btn btn-dark flex-1">upload photo</button>
      </div>
      <p id="upload-error" class="text-xs text-rose-500"></p>
    </form>`);

  $('#close-modal').onclick = $('#cancel-modal').onclick = closeModal;

  $('#photo-form').onsubmit = async event => {
    event.preventDefault();
    const formData = new FormData(event.currentTarget);
    const file = formData.get('file');
    if (!file || !file.size) return;

    if (file.size > 8 * 1024 * 1024) {
      $('#upload-error').textContent = 'Please choose an image smaller than 8 MB.';
      return;
    }

    const button = $('#upload-submit');
    button.disabled = true;
    button.textContent = 'uploading…';

    try {
      if (!storage) throw new Error('Firebase Storage is unavailable. Enable Storage in Firebase Console.');

      const id = uid();
      const path = `photos/${id}/${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
      const reference = storage.ref().child(path);

      await reference.put(file, {contentType:file.type || 'image/jpeg'});
      const url = await reference.getDownloadURL();

      const photo = {
        id,
        url,
        storagePath:path,
        caption:String(formData.get('caption') || '').trim(),
        folderId:String(formData.get('folderId') || ''),
        createdAt:new Date().toISOString(),
        author:state.user
      };

      await writeDoc('photos', photo);
      closeModal();
      toast('Photo uploaded.');
      render();
    } catch (error) {
      console.error(error);
      $('#upload-error').textContent = error.message || 'Upload failed. Check Firebase Storage rules.';
      button.disabled = false;
      button.textContent = 'try again';
    }
  };
}

async function uploadNoteImages(files, existing) {
  const result = [...(existing || [])];
  if (!files?.length) return result;

  if (!storage) {
    throw new Error('Firebase Storage is unavailable. Enable Storage before attaching photos.');
  }

  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    if (file.size > 8 * 1024 * 1024) {
      throw new Error(`${file.name} is larger than 8 MB.`);
    }

    const id = uid();
    const path = `note-images/${id}/${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    const reference = storage.ref().child(path);
    await reference.put(file, {contentType:file.type || 'image/jpeg'});
    result.push(await reference.getDownloadURL());
  }

  return result;
}

async function saveNoteForm(form) {
  if (state.busy) return;

  state.busy = true;
  const button = $('#save-note');
  if (button) {
    button.disabled = true;
    button.textContent = 'saving…';
  }

  try {
    const formData = new FormData(form);
    const old = state.notes.find(item => item.id === state.activeNoteId);
    const title = String(formData.get('title') || '').trim();
    const content = String(formData.get('content') || '').trim();

    if (!title && !content) {
      toast('Add a title or some writing first.');
      return;
    }

    const files = [...($('#note-images')?.files || [])];
    const images = await uploadNoteImages(files, old?.images || []);

    const item = {
      id:old?.id || uid(),
      title,
      content,
      folderId:String(formData.get('folderId') || ''),
      published:formData.get('published') === 'true',
      images,
      author:old?.author || state.user,
      createdAt:old?.createdAt || new Date().toISOString(),
      updatedAt:new Date().toISOString()
    };

    await writeDoc('notes', item);
    state.activeNoteId = item.id;
    state.view = 'note-detail';
    toast('Note saved successfully.');
    render();
  } catch (error) {
    console.error(error);
    toast(error.message || 'Could not save note. Check Firebase rules.');
  } finally {
    state.busy = false;
  }
}

  if (!photo) return;

  try {
    await deleteDoc('photos', id);
    if (storage && photo.storagePath) {
      try {
        await storage.ref().child(photo.storagePath).delete();
      } catch (error) {
        console.warn('Storage file could not be deleted:', error);
      }
    }
    toast('Photo removed.');
    render();

    console.error(error);
    toast('Could not remove photo.');

function bindMain() {
  $('#app').addEventListener('click', async event => {
    const noteButton = event.target.closest('[data-note]');
    if (noteButton) {
      state.activeNoteId = noteButton.dataset.note;
      state.view = 'note-detail';
      render();
      return;
    }

    const folderButton = event.target.closest('[data-folder]');
    if (folderButton) {
      state.activeFolderId = folderButton.dataset.folder;
      state.view = 'folder-detail';
      render();
      return;
    }

    const photoButton = event.target.closest('[data-photo]');
    if (photoButton) {
      openPhoto(photoButton.dataset.photo);
      return;
    }

    const deletePhotoButton = event.target.closest('[data-delete-photo]');
    if (deletePhotoButton) {
      deletePhoto(deletePhotoButton.dataset.deletePhoto);
      return;
    }

    const removeImageButton = event.target.closest('[data-remove-image]');
    if (removeImageButton) {
      const note = state.notes.find(item => item.id === state.activeNoteId);
      if (note) {
        note.images.splice(Number(removeImageButton.dataset.removeImage), 1);
        render();
      }
    }
  });

  $('#app').addEventListener('input', event => {
    if (event.target.id !== 'search') return;

    state.search = event.target.value;
    const query = state.search.toLowerCase();
    const list = visibleNotes().filter(note =>
      (note.title || '').toLowerCase().includes(query) ||
      (note.content || '').toLowerCase().includes(query)
    ).sort((a,b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));

    const results = $('#note-results');
    if (results) {
      results.innerHTML = list.length
        ? list.map(noteCard).join('')
        : '<div class="empty">No notes match your search.</div>';
      refreshIcons();
    }
  });

  $('#app').addEventListener('submit', event => {
    if (event.target.id === 'note-editor') {
      event.preventDefault();
      saveNoteForm(event.target);
    }
  });

  $('#app').addEventListener('change', event => {
    if (event.target.id !== 'note-images') return;

    const preview = $('#note-image-preview');
    if (!preview) return;

    const note = state.notes.find(item => item.id === state.activeNoteId);
    const existing = note?.images || [];

    preview.innerHTML = existing.map((url,index) => `
      <div class="relative aspect-square rounded-lg overflow-hidden">
        <img src="${esc(url)}" class="photo-img" alt="attachment">
        <button type="button" data-remove-image="${index}" class="absolute top-1 right-1 rounded-full bg-black/70 text-white w-6 h-6">×</button>
      </div>`).join('');

    [...event.target.files].forEach(file => {
      const url = URL.createObjectURL(file);
      preview.insertAdjacentHTML('beforeend', `
        <div class="aspect-square rounded-lg overflow-hidden">
          <img src="${url}" class="photo-img" alt="selected image">
        </div>`);
    });
  });
}

function loadCloud() {
  if (!db) {
    state.cloudStatus = 'Local preview only';
    return;
  }

  const subscribe = (collection, apply, fallback) => {
    const unsubscribe = db.collection(collection).onSnapshot(snapshot => {
      const rows = snapshot.docs.map(document => ({
        ...document.data(),
        id:document.id
      }));

      apply(rows.length ? rows : fallback);
      persistLocal();
      render();
    }, error => {
      console.error(`Firestore ${collection} listener error:`, error);
      cloudError = `Could not sync ${collection}. Check Firestore rules and connection.`;
      render();
    });

    state.unsubs.push(unsubscribe);
  };

  subscribe('notes', rows => state.notes = rows, SAMPLE_NOTES.map(note => ({...note})));
  subscribe('folders', rows => state.folders = rows, SAMPLE_FOLDERS.map(folder => ({...folder})));
  subscribe('photos', rows => state.photos = rows, []);
}

/* A visible error screen prevents a silent blank page if startup fails. */
window.addEventListener('error', event => {
  console.error('App runtime error:', event.error || event.message);
});

window.addEventListener('unhandledrejection', event => {
  console.error('Unhandled app error:', event.reason);
});

try {
  loadLocal();
  bindMain();

  if (state.user) render();
  else loginScreen();

  loadCloud();
} catch (error) {
  console.error('App startup failed:', error);
  const app = $('#app');

  if (app) {
    app.innerHTML = `
      <main style="max-width:560px;margin:12vh auto;padding:24px;font-family:system-ui;color:#2c2a29">
        <h1>notes for me &amp; rhy</h1>
        <p>Sorry, the app could not start.</p>
        <p>Refresh the page. If the problem continues, check the browser console for the first error message.</p>
        <button onclick="location.reload()" style="padding:10px 16px;border-radius:999px;background:#2c2a29;color:white;border:0">Reload page</button>
      </main>`;
  }
}
})();
</script>
</body>
</html>
