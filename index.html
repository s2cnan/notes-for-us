<script>
(() => {
'use strict';

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

const uid = () => 'id-' + (
  crypto.randomUUID
    ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now()
);

const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
})[char]);

const dateLabel = value => {
  const date = new Date(value);
  return Number.isNaN(date.getTime())
    ? ''
    : date.toLocaleDateString(undefined, {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
};

/* Firebase configuration */
const CONFIG = {
  apiKey: "AIzaSyDi1QnBd-rPnhbPF75iXd8u99FGKJLkV7Y",
  authDomain: "notes-for-me-and-rhy.firebaseapp.com",
  projectId: "notes-for-me-and-rhy",
  storageBucket: "notes-for-me-and-rhy.firebasestorage.app",
  messagingSenderId: "356957167276",
  appId: "1:356957167276:web:ea399abac3ee4493b2c909",
  measurementId: "G-0QK1QQ6SX4"
};

const SAMPLE_NOTES = [
  {
    id: 'note-1',
    title: 'little moments in leyte',
    content: 'today was quiet and peaceful. the afternoon sun felt warm against the glass, and listening to your voice note made the whole day feel lighter. notes for me & rhy is our little corner of the internet to keep these small memories safe.',
    folderId: 'folder-memories',
    tags: ['memories', 'thoughts'],
    published: true,
    author: 'Ronan',
    createdAt: '2025-05-21T08:00:00.000Z',
    updatedAt: '2025-05-21T08:00:00.000Z',
    images: []
  },
  {
    id: 'note-2',
    title: 'a letter for tomorrow',
    content: 'just wanted to remind you how much every single conversation means to me. no matter how busy things get with college and everything else, this place is always here for us.',
    folderId: 'folder-letters',
    tags: ['letters'],
    published: true,
    author: 'Rhy',
    createdAt: '2025-05-22T08:00:00.000Z',
    updatedAt: '2025-05-22T08:00:00.000Z',
    images: []
  }
];

const SAMPLE_FOLDERS = [
  {
    id: 'folder-memories',
    name: 'memories',
    description: 'our everyday moments',
    color: '#D4A3A3',
    visibility: 'public'
  },
  {
    id: 'folder-letters',
    name: 'letters',
    description: 'notes written just for us',
    color: '#EAE6F8',
    visibility: 'shared'
  },
  {
    id: 'folder-photos',
    name: 'our pictures',
    description: 'snapshots and memories',
    color: '#F7EBE8',
    visibility: 'public'
  }
];

let db = null;
let storage = null;
let cloudError = '';

try {
  if (!firebase.apps.length) {
    firebase.initializeApp(CONFIG);
  }
  db = firebase.firestore();

  try {
    storage = firebase.storage();
  } catch (error) {
    console.warn('Firebase Storage unavailable:', error);
  }
} catch (error) {
  cloudError = 'Firebase could not initialize. Running in this browser only.';
  console.error('Firebase initialization failed:', error);
}

const state = {
  user: sessionStorage.getItem('notes_user') || null,
  view: 'home',
  notes: [],
  folders: [],
  photos: [],
  search: '',
  activeNoteId: null,
  activeFolderId: null,
  busy: false,
  unsubs: [],
  toastTimer: null
};

function toast(message) {
  const element = $('#toast');
  element.textContent = message;
  element.hidden = false;
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => {
    element.hidden = true;
  }, 3200);
}

function icon(name, size = 17) {
  return `<i data-lucide="${esc(name)}" width="${size}" height="${size}" aria-hidden="true"></i>`;
}

function refreshIcons() {
  if (window.lucide) window.lucide.createIcons();
}

function persistLocal() {
  try {
    localStorage.setItem('notes_local_notes', JSON.stringify(state.notes));
    localStorage.setItem('notes_local_folders', JSON.stringify(state.folders));
    localStorage.setItem('notes_local_photos', JSON.stringify(state.photos));
  } catch (error) {
    console.warn('Local cache could not be saved:', error);
  }
}

function loadLocal() {
  try {
    state.notes = JSON.parse(localStorage.getItem('notes_local_notes') || 'null')
      || SAMPLE_NOTES.map(note => ({ ...note }));

    state.folders = JSON.parse(localStorage.getItem('notes_local_folders') || 'null')
      || SAMPLE_FOLDERS.map(folder => ({ ...folder }));

    state.photos = JSON.parse(localStorage.getItem('notes_local_photos') || '[]') || [];
  } catch (error) {
    state.notes = SAMPLE_NOTES.map(note => ({ ...note }));
    state.folders = SAMPLE_FOLDERS.map(folder => ({ ...folder }));
    state.photos = [];
  }
}

function isAdmin() {
  return state.user === 'Ronan' || state.user === 'Rhy';
}

function visibleNotes() {
  return state.notes.filter(note => isAdmin() || note.published === true);
}

function getFolder(id) {
  return state.folders.find(folder => folder.id === id);
}

function anniversary() {
  const start = new Date(2025, 4, 19);
  const now = new Date();
  const elapsed = Math.max(0, Math.floor((now - start) / 86400000));

  let next = new Date(now.getFullYear(), 4, 19);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  if (next < today) {
    next = new Date(now.getFullYear() + 1, 4, 19);
  }

  const days = Math.ceil((next - today) / 86400000);

  return {
    elapsed,
    days,
    nextYear: next.getFullYear()
  };
}

/* Firestore listeners: each collection handles its own errors. */
function loadCloud() {
  if (!db) {
    render();
    return;
  }

  const subscribe = (collection, apply, fallback) => {
    const unsubscribe = db.collection(collection).onSnapshot(
      snapshot => {
        const rows = snapshot.docs.map(document => ({
          ...document.data(),
          id: document.id
        }));

        apply(rows.length ? rows : fallback);
        persistLocal();
        render();
      },
      error => {
        console.error(`Firestore ${collection} error:`, error);
        cloudError = `Could not sync ${collection}. Check your Firebase connection and rules.`;
        render();
      }
    );

    state.unsubs.push(unsubscribe);
  };

  subscribe('notes', rows => {
    state.notes = rows;
  }, SAMPLE_NOTES.map(note => ({ ...note })));

  subscribe('folders', rows => {
    state.folders = rows;
  }, SAMPLE_FOLDERS.map(folder => ({ ...folder })));

  subscribe('photos', rows => {
    state.photos = rows;
  }, []);
}

async function writeDoc(collection, item) {
  if (db) {
    await db.collection(collection).doc(item.id).set(item);
    return;
  }

  const array = collection === 'notes'
    ? state.notes
    : collection === 'folders'
      ? state.folders
      : state.photos;

  const index = array.findIndex(existing => existing.id === item.id);

  if (index >= 0) array[index] = item;
  else array.unshift(item);

  persistLocal();
}

async function deleteDoc(collection, id) {
  if (db) {
    await db.collection(collection).doc(id).delete();
    return;
  }

  const array = collection === 'notes'
    ? state.notes
    : collection === 'folders'
      ? state.folders
      : state.photos;

  const index = array.findIndex(item => item.id === id);
  if (index >= 0) array.splice(index, 1);

  persistLocal();
}
