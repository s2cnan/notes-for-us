<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>notes for me & rhy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: '#FDFBF7',
                        warmBlush: '#F7EBE8',
                        dustyRose: '#D4A3A3',
                        charcoal: '#2C2A29',
                        softLavender: '#EAE6F8'
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFBF7; color: #2C2A29; -webkit-tap-highlight-color: transparent; }
        h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D4A3A3; border-radius: 4px; }
    </style>
</head>
<body class="h-full bg-cream text-charcoal antialiased selection:bg-warmBlush">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const generateId = () => '_' + Math.random().toString(36).substr(2, 9);

        const initialNotes = [
            {
                id: 'note-1',
                title: 'little moments in leyte',
                content: 'today was quiet and peaceful. the afternoon sun felt warm against the glass, and listening to your voice note made the whole day feel lighter. notes for me & rhy is our little corner of the internet to keep these small memories safe.',
                folderId: 'folder-memories',
                tags: ['memories', 'thoughts'],
                published: true,
                author: 'Ronan',
                createdAt: new Date(Date.now() - 86400000 * 2).toISOString(),
                updatedAt: new Date(Date.now() - 86400000 * 2).toISOString(),
                images: []
            },
            {
                id: 'note-2',
                title: 'a letter for tomorrow',
                content: 'just wanted to remind you how much every single conversation means to me. no matter how busy things get with college and everything else, this place is always here for us.',
                folderId: 'folder-letters',
                tags: ['letters'],
                published: true,
                author: 'Rhy',
                createdAt: new Date(Date.now() - 86400000).toISOString(),
                updatedAt: new Date(Date.now() - 86400000).toISOString(),
                images: []
            }
        ];

        const initialFolders = [
            { id: 'folder-memories', name: 'memories', description: 'our everyday moments', color: '#D4A3A3', visibility: 'public' },
            { id: 'folder-letters', name: 'letters', description: 'notes written just for us', color: '#EAE6F8', visibility: 'shared' },
            { id: 'folder-photos', name: 'our pictures', description: 'snapshots and memories', color: '#F7EBE8', visibility: 'public' }
        ];

        function App() {
            const [notes, setNotes] = useState(() => JSON.parse(localStorage.getItem('rhythm_notes') || JSON.stringify(initialNotes)));
            const [folders, setFolders] = useState(() => JSON.parse(localStorage.getItem('rhythm_folders') || JSON.stringify(initialFolders)));
            const [photos, setPhotos] = useState(() => JSON.parse(localStorage.getItem('rhythm_photos') || '[]'));
            const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('rhythm_current_user') || null);
            const [currentView, setCurrentView] = useState('home');
            const [activeNote, setActiveNote] = useState(null);
            const [activeFolder, setActiveFolder] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [toast, setToast] = useState(null);

            useEffect(() => { localStorage.setItem('rhythm_notes', JSON.stringify(notes)); }, [notes]);
            useEffect(() => { localStorage.setItem('rhythm_folders', JSON.stringify(folders)); }, [folders]);
            useEffect(() => { localStorage.setItem('rhythm_photos', JSON.stringify(photos)); }, [photos]);
            useEffect(() => {
                if (currentUser) localStorage.setItem('rhythm_current_user', currentUser);
                else localStorage.removeItem('rhythm_current_user');
            }, [currentUser]);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [currentView, notes, folders, photos, toast, currentUser]);

            const isAdmin = currentUser && currentUser !== 'guest';

            if (!currentUser) {
                return <LoginScreen onLogin={(user) => { setCurrentUser(user); showToast(`Welcome, ${user === 'guest' ? 'Guest' : user}!`); }} />;
            }

            return (
                <div className="min-h-full flex flex-col bg-cream text-charcoal">
                    {toast && (
                        <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-charcoal text-cream px-4 py-2 rounded-full text-sm shadow-lg transition-all animate-bounce">
                            {toast}
                        </div>
                    )}

                    <header className="sticky top-0 z-40 bg-cream/85 backdrop-blur-md border-b border-warmBlush px-4 py-3">
                        <div className="max-w-2xl mx-auto flex items-center justify-between">
                            <button onClick={() => setCurrentView('home')} className="text-left">
                                <h1 className="font-serif text-lg tracking-tight font-medium">notes for me & rhy</h1>
                                <p className="text-xs text-stone-500 font-light">digital journal & memories</p>
                            </button>
                            
                            <div className="flex items-center gap-2">
                                <span className="text-xs px-2.5 py-1 rounded-full bg-warmBlush text-charcoal font-medium">
                                    {isAdmin ? `✨ ${currentUser}` : '👀 guest'}
                                </span>
                                <button onClick={() => setCurrentUser(null)} className="text-xs text-stone-500 hover:text-charcoal px-2 py-1 underline">
                                    logout
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-2xl w-full mx-auto px-4 py-6 pb-24">
                        {currentView === 'home' && (
                            <HomeView 
                                notes={notes} folders={folders} photos={photos} isAdmin={isAdmin}
                                onSelectNote={(n) => { setActiveNote(n); setCurrentView('view-note'); }}
                                onSelectFolder={(f) => { setActiveFolder(f); setCurrentView('folder-detail'); }}
                                onCreateNote={() => { setActiveNote(null); setCurrentView('editor'); }}
                                onCreateFolder={() => {
                                    const name = prompt('Enter folder name:');
                                    if (name) {
                                        setFolders([...folders, { id: generateId(), name, description: '', color: '#F7EBE8', visibility: 'public' }]);
                                        showToast('Folder created!');
                                    }
                                }}
                                onViewAllNotes={() => setCurrentView('notes')}
                                onViewAllPhotos={() => setCurrentView('photos')}
                            />
                        )}

                        {currentView === 'notes' && (
                            <AllNotesView 
                                notes={notes} isAdmin={isAdmin} searchQuery={searchQuery} setSearchQuery={setSearchQuery}
                                onSelectNote={(n) => { setActiveNote(n); setCurrentView('view-note'); }}
                                onBack={() => setCurrentView('home')}
                                onCreateNote={() => { setActiveNote(null); setCurrentView('editor'); }}
                            />
                        )}

                        {currentView === 'view-note' && activeNote && (
                            <NoteDetailView 
                                note={activeNote} folders={folders} isAdmin={isAdmin} currentUser={currentUser}
                                onBack={() => setCurrentView('home')}
                                onEdit={() => setCurrentView('editor')}
                                onDelete={() => {
                                    if (confirm('Delete this note?')) {
                                        setNotes(notes.filter(n => n.id !== activeNote.id));
                                        setCurrentView('home');
                                        showToast('Note deleted.');
                                    }
                                }}
                            />
                        )}

                        {currentView === 'editor' && isAdmin && (
                            <NoteEditorView 
                                initialNote={activeNote} folders={folders} currentUser={currentUser}
                                onSave={(savedNote) => {
                                    if (activeNote) setNotes(notes.map(n => n.id === savedNote.id ? savedNote : n));
                                    else setNotes([savedNote, ...notes]);
                                    setCurrentView('home');
                                    showToast('Note saved successfully!');
                                }}
                                onCancel={() => setCurrentView('home')}
                            />
                        )}

                        {currentView === 'folder-detail' && activeFolder && (
                            <FolderDetailView 
                                folder={activeFolder}
                                notes={notes.filter(n => n.folderId === activeFolder.id)}
                                photos={photos.filter(p => p.folderId === activeFolder.id)}
                                isAdmin={isAdmin}
                                onBack={() => setCurrentView('home')}
                                onSelectNote={(n) => { setActiveNote(n); setCurrentView('view-note'); }}
                                onAddPhoto={(photoUrl, caption) => {
                                    setPhotos([...photos, { id: generateId(), url: photoUrl, caption, folderId: activeFolder.id, createdAt: new Date().toISOString() }]);
                                    showToast('Photo added!');
                                }}
                            />
                        )}

                        {currentView === 'photos' && (
                            <PhotosView 
                                photos={photos} folders={folders} isAdmin={isAdmin}
                                onBack={() => setCurrentView('home')}
                                onAddPhoto={(photoUrl, caption, folderId) => {
                                    setPhotos([...photos, { id: generateId(), url: photoUrl, caption, folderId: folderId || '', createdAt: new Date().toISOString() }]);
                                    showToast('Photo added to memories!');
                                }}
                                onDeletePhoto={(id) => {
                                    setPhotos(photos.filter(p => p.id !== id));
                                    showToast('Photo removed.');
                                }}
                            />
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-cream/90 backdrop-blur-md border-t border-warmBlush py-3 px-6 z-30">
                        <div className="max-w-xs mx-auto flex justify-around items-center">
                            <button onClick={() => setCurrentView('home')} className={`flex flex-col items-center gap-1 text-xs ${currentView === 'home' ? 'text-charcoal font-semibold' : 'text-stone-400'}`}>
                                <i data-lucide="home" className="w-5 h-5"></i><span>home</span>
                            </button>
                            <button onClick={() => setCurrentView('notes')} className={`flex flex-col items-center gap-1 text-xs ${currentView === 'notes' ? 'text-charcoal font-semibold' : 'text-stone-400'}`}>
                                <i data-lucide="book-open" className="w-5 h-5"></i><span>notes</span>
                            </button>
                            {isAdmin && (
                                <button onClick={() => { setActiveNote(null); setCurrentView('editor'); }} className="flex flex-col items-center gap-1 text-xs text-rose-500 font-semibold bg-warmBlush p-2 rounded-full -mt-4 shadow-sm">
                                    <i data-lucide="plus" className="w-6 h-6"></i>
                                </button>
                            )}
                            <button onClick={() => setCurrentView('photos')} className={`flex flex-col items-center gap-1 text-xs ${currentView === 'photos' ? 'text-charcoal font-semibold' : 'text-stone-400'}`}>
                                <i data-lucide="image" className="w-5 h-5"></i><span>photos</span>
                            </button>
                            {isAdmin && (
                                <button onClick={() => {
                                    const name = prompt('New folder name:');
                                    if (name) {
                                        setFolders([...folders, { id: generateId(), name, description: '', color: '#F7EBE8', visibility: 'public' }]);
                                        showToast('Folder created!');
                                    }
                                }} className="flex flex-col items-center gap-1 text-xs text-stone-400">
                                    <i data-lucide="folder-plus" className="w-5 h-5"></i><span>folder</span>
                                </button>
                            )}
                        </div>
                    </nav>
                </div>
            );
        }

        function LoginScreen({ onLogin }) {
            const [selectedUser, setSelectedUser] = useState(null);
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (password === 'Admin123') onLogin(selectedUser);
                else setError('Incorrect password. Hint: Admin123');
            };

            return (
                <div className="min-h-full flex items-center justify-center p-4 bg-cream">
                    <div className="max-w-md w-full bg-white p-8 rounded-2xl border border-stone-200 shadow-sm space-y-6 text-center">
                        <div>
                            <h1 className="font-serif text-2xl mb-1">notes for me & rhy</h1>
                            <p className="text-xs text-stone-500 font-light">select your profile or continue as guest</p>
                        </div>

                        {!selectedUser ? (
                            <div className="space-y-3">
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setSelectedUser('Ronan')} className="p-4 rounded-xl border border-stone-200 bg-warmBlush/30 hover:border-dustyRose font-serif text-lg transition-all">Ronan</button>
                                    <button onClick={() => setSelectedUser('Rhy')} className="p-4 rounded-xl border border-stone-200 bg-warmBlush/30 hover:border-dustyRose font-serif text-lg transition-all">Rhy</button>
                                </div>
                                <button onClick={() => onLogin('guest')} className="w-full py-3 rounded-xl border border-stone-200 text-stone-600 text-sm hover:bg-stone-50 transition-all">👀 continue as guest</button>
                            </div>
                        ) : (
                            <form onSubmit={handleLoginSubmit} className="space-y-4">
                                <div className="text-sm font-medium text-stone-700">Logging in as <span className="font-serif text-rose-500 font-bold">{selectedUser}</span></div>
                                <input type="password" placeholder="enter password (Admin123)" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-3 rounded-xl bg-stone-50 border border-stone-200 text-sm text-center focus:outline-none focus:border-dustyRose" autoFocus />
                                {error && <p className="text-xs text-rose-500">{error}</p>}
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => { setSelectedUser(null); setPassword(''); setError(''); }} className="flex-1 py-2.5 rounded-xl border border-stone-200 text-xs text-stone-600">back</button>
                                    <button type="submit" className="flex-1 py-2.5 rounded-xl bg-charcoal text-cream text-xs font-medium">login</button>
                                </div>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        function HomeView({ notes, folders, photos, isAdmin, onSelectNote, onSelectFolder, onCreateNote, onCreateFolder, onViewAllNotes, onViewAllPhotos }) {
            const displayedNotes = isAdmin ? notes : notes.filter(n => n.published);

            return (
                <div className="space-y-8 animate-fadeIn">
                    <div className="text-center py-6 px-4 bg-warmBlush/40 rounded-2xl border border-warmBlush/60 space-y-2">
                        <h2 className="font-serif text-2xl font-normal">notes for me & rhy</h2>
                        <p className="text-sm text-stone-600 max-w-md mx-auto font-light leading-relaxed">a quiet space for our thoughts, letters, photos, and memories.</p>
                        {isAdmin && (
                            <div className="pt-2 flex justify-center gap-3">
                                <button onClick={onCreateNote} className="px-4 py-2 bg-charcoal text-cream rounded-full text-xs font-medium shadow-sm hover:opacity-90 flex items-center gap-2">
                                    <i data-lucide="pen-tool" className="w-3.5 h-3.5"></i> write a note
                                </button>
                                <button onClick={onCreateFolder} className="px-4 py-2 bg-white text-charcoal border border-stone-200 rounded-full text-xs font-medium hover:bg-stone-50 flex items-center gap-2">
                                    <i data-lucide="folder-plus" className="w-3.5 h-3.5"></i> new folder
                                </button>
                            </div>
                        )}
                    </div>

                    <div>
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-serif text-lg">folders</h3>
                            <span className="text-xs text-stone-400">{folders.length} folders</span>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            {folders.map(folder => (
                                <div key={folder.id} onClick={() => onSelectFolder(folder)} className="p-4 rounded-xl border border-stone-200/80 bg-white hover:border-dustyRose transition-all cursor-pointer shadow-sm">
                                    <div className="flex items-center justify-between mb-2">
                                        <i data-lucide="folder" className="w-5 h-5 text-dustyRose"></i>
                                        <span className="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-stone-100 text-stone-500">{folder.visibility}</span>
                                    </div>
                                    <h4 className="font-serif font-medium text-base mb-1">{folder.name}</h4>
                                    {folder.description && <p className="text-xs text-stone-500 line-clamp-1">{folder.description}</p>}
                                </div>
                            ))}
                        </div>
                    </div>

                    <div>
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-serif text-lg">recent notes</h3>
                            <button onClick={onViewAllNotes} className="text-xs text-stone-500 hover:underline">view all</button>
                        </div>
                        <div className="space-y-3">
                            {displayedNotes.slice(0, 3).map(note => (
                                <div key={note.id} onClick={() => onSelectNote(note)} className="p-4 rounded-xl bg-white border border-stone-200/80 hover:border-dustyRose transition-all cursor-pointer shadow-sm">
                                    <div className="flex items-center justify-between text-xs text-stone-400 mb-1">
                                        <span>{new Date(note.createdAt).toLocaleDateString()} {note.author && `• by ${note.author}`}</span>
                                    </div>
                                    <h4 className="font-serif text-lg mb-1">{note.title || 'untitled'}</h4>
                                    <p className="text-sm text-stone-600 line-clamp-2 font-light">{note.content}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div>
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="font-serif text-lg">photo memories</h3>
                            <button onClick={onViewAllPhotos} className="text-xs text-stone-500 hover:underline">view gallery</button>
                        </div>
                        {photos.length === 0 ? (
                            <p className="text-sm text-stone-400 italic">No photos uploaded yet.</p>
                        ) : (
                            <div className="grid grid-cols-3 gap-2">
                                {photos.slice(0, 3).map(photo => (
                                    <div key={photo.id} className="aspect-square rounded-lg overflow-hidden bg-stone-100 border border-stone-200">
                                        <img src={photo.url} alt={photo.caption || 'memory'} className="w-full h-full object-cover" />
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function AllNotesView({ notes, isAdmin, searchQuery, setSearchQuery, onSelectNote, onBack, onCreateNote }) {
            const filteredNotes = notes.filter(n => (isAdmin || n.published) && (n.title.toLowerCase().includes(searchQuery.toLowerCase()) || n.content.toLowerCase().includes(searchQuery.toLowerCase())));

            return (
                <div className="space-y-4">
                    <div className="flex items-center justify-between">
                        <button onClick={onBack} className="text-xs text-stone-500 flex items-center gap-1">
                            <i data-lucide="arrow-left" className="w-4 h-4"></i> back home
                        </button>
                        <h2 className="font-serif text-xl">all notes</h2>
                        {isAdmin ? <button onClick={onCreateNote} className="text-xs bg-charcoal text-cream px-3 py-1.5 rounded-full">new note</button> : <div />}
                    </div>

                    <div className="relative">
                        <i data-lucide="search" className="absolute left-3 top-3 w-4 h-4 text-stone-400"></i>
                        <input type="text" placeholder="search notes..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 rounded-xl bg-white border border-stone-200 text-sm focus:outline-none focus:border-dustyRose" />
                    </div>

                    <div className="space-y-3">
                        {filteredNotes.map(note => (
                            <div key={note.id} onClick={() => onSelectNote(note)} className="p-4 rounded-xl bg-white border border-stone-200/80 hover:border-dustyRose transition-all cursor-pointer shadow-sm">
                                <div className="flex items-center justify-between text-xs text-stone-400 mb-1">
                                    <span>{new Date(note.createdAt).toLocaleDateString()} {note.author && `• by ${note.author}`}</span>
                                    {!note.published && <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px]">draft</span>}
                                </div>
                                <h4 className="font-serif text-lg mb-1">{note.title || 'untitled'}</h4>
                                <p className="text-sm text-stone-600 line-clamp-2 font-light">{note.content}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function NoteDetailView({ note, folders, isAdmin, currentUser, onBack, onEdit, onDelete }) {
            const folder = folders.find(f => f.id === note.folderId);

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <button onClick={onBack} className="text-xs text-stone-500 flex items-center gap-1">
                            <i data-lucide="arrow-left" className="w-4 h-4"></i> back
                        </button>
                        {isAdmin && (
                            <div className="flex items-center gap-2">
                                <button onClick={onEdit} className="text-xs bg-stone-100 px-3 py-1 rounded-full text-stone-600">edit</button>
                                <button onClick={onDelete} className="text-xs bg-rose-50 text-rose-600 px-3 py-1 rounded-full">delete</button>
                            </div>
                        )}
                    </div>

                    <article className="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm space-y-4">
                        <div className="flex items-center justify-between text-xs text-stone-400 border-b border-stone-100 pb-3">
                            <span>{new Date(note.createdAt).toLocaleDateString()} {note.author && `• written by ${note.author}`}</span>
                            {folder && <span className="text-rose-400 font-medium">{folder.name}</span>}
                        </div>
                        <h2 className="font-serif text-2xl font-normal">{note.title || 'untitled'}</h2>
                        <div className="text-stone-700 font-light leading-relaxed whitespace-pre-wrap text-base">{note.content}</div>
                        {note.images && note.images.length > 0 && (
                            <div className="grid grid-cols-2 gap-2 pt-4">
                                {note.images.map((img, idx) => (
                                    <div key={idx} className="rounded-lg overflow-hidden border border-stone-200">
                                        <img src={img} alt="attachment" className="w-full h-40 object-cover" />
                                    </div>
                                ))}
                            </div>
                        )}
                    </article>
                </div>
            );
        }

        function NoteEditorView({ initialNote, folders, currentUser, onSave, onCancel }) {
            const [title, setTitle] = useState(initialNote ? initialNote.title : '');
            const [content, setContent] = useState(initialNote ? initialNote.content : '');
            const [folderId, setFolderId] = useState(initialNote ? initialNote.folderId : (folders[0]?.id || ''));
            const [published, setPublished] = useState(initialNote ? initialNote.published : true);
            const [images, setImages] = useState(initialNote ? initialNote.images || [] : []);

            const handleImageUpload = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setImages(prev => [...prev, reader.result]);
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleSave = (e) => {
                e.preventDefault();
                onSave({
                    id: initialNote ? initialNote.id : generateId(),
                    title, content, folderId, published, images,
                    author: initialNote ? initialNote.author : currentUser,
                    createdAt: initialNote ? initialNote.createdAt : new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
            };

            return (
                <form onSubmit={handleSave} className="space-y-4">
                    <div className="flex items-center justify-between">
                        <button type="button" onClick={onCancel} className="text-xs text-stone-500">cancel</button>
                        <h2 className="font-serif text-lg">{initialNote ? 'edit note' : 'new note'}</h2>
                        <button type="submit" className="text-xs bg-charcoal text-cream px-4 py-1.5 rounded-full font-medium">save</button>
                    </div>

                    <input type="text" placeholder="note title..." value={title} onChange={(e) => setTitle(e.target.value)} className="w-full font-serif text-2xl bg-transparent border-b border-stone-200 pb-2 focus:outline-none focus:border-dustyRose" />

                    <div className="grid grid-cols-2 gap-3">
                        <div>
                            <label className="text-xs text-stone-400 block mb-1">folder</label>
                            <select value={folderId} onChange={(e) => setFolderId(e.target.value)} className="w-full p-2 rounded-xl bg-white border border-stone-200 text-sm focus:outline-none">
                                <option value="">(unfiled)</option>
                                {folders.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="text-xs text-stone-400 block mb-1">status</label>
                            <select value={published ? 'true' : 'false'} onChange={(e) => setPublished(e.target.value === 'true')} className="w-full p-2 rounded-xl bg-white border border-stone-200 text-sm focus:outline-none">
                                <option value="true">published</option>
                                <option value="false">draft</option>
                            </select>
                        </div>
                    </div>

                    <textarea rows="10" placeholder="write your thoughts here..." value={content} onChange={(e) => setContent(e.target.value)} className="w-full p-4 rounded-xl bg-white border border-stone-200 text-sm font-light leading-relaxed focus:outline-none focus:border-dustyRose"></textarea>

                    <div className="space-y-2">
                        <label className="text-xs text-stone-500 block">attach photos from device</label>
                        <input type="file" accept="image/*" multiple onChange={handleImageUpload} className="text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:bg-warmBlush file:text-charcoal hover:file:bg-dustyRose/30" />
                        {images.length > 0 && (
                            <div className="grid grid-cols-3 gap-2 pt-2">
                                {images.map((img, i) => (
                                    <div key={i} className="relative aspect-square rounded-lg overflow-hidden border">
                                        <img src={img} alt="preview" className="w-full h-full object-cover" />
                                        <button type="button" onClick={() => setImages(images.filter((_, idx) => idx !== i))} className="absolute top-1 right-1 bg-black/60 text-white rounded-full p-1 text-[10px]">×</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </form>
            );
        }

        function FolderDetailView({ folder, notes, photos, isAdmin, onBack, onSelectNote, onAddPhoto }) {
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const caption = prompt('Enter a short caption (optional):');
                        onAddPhoto(reader.result, caption || '');
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <button onClick={onBack} className="text-xs text-stone-500 flex items-center gap-1">
                            <i data-lucide="arrow-left" className="w-4 h-4"></i> back
                        </button>
                        <h2 className="font-serif text-xl">{folder.name}</h2>
                        {isAdmin && (
                            <label className="text-xs bg-warmBlush px-3 py-1.5 rounded-full text-charcoal cursor-pointer">
                                add photo <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                            </label>
                        )}
                    </div>

                    {folder.description && <p className="text-sm text-stone-600 font-light bg-warmBlush/30 p-3 rounded-xl">{folder.description}</p>}

                    <div>
                        <h3 className="font-serif text-lg mb-3">notes in this folder</h3>
                        <div className="space-y-3">
                            {notes.map(note => (
                                <div key={note.id} onClick={() => onSelectNote(note)} className="p-4 rounded-xl bg-white border border-stone-200/80 cursor-pointer shadow-sm">
                                    <h4 className="font-serif text-lg mb-1">{note.title || 'untitled'}</h4>
                                    <p className="text-sm text-stone-600 line-clamp-1 font-light">{note.content}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div>
                        <h3 className="font-serif text-lg mb-3">photos in this folder</h3>
                        <div className="grid grid-cols-2 gap-3">
                            {photos.map(photo => (
                                <div key={photo.id} className="bg-white p-2 rounded-xl border border-stone-200 shadow-sm space-y-2">
                                    <div className="aspect-square rounded-lg overflow-hidden bg-stone-100">
                                        <img src={photo.url} alt={photo.caption} className="w-full h-full object-cover" />
                                    </div>
                                    {photo.caption && <p className="text-xs text-stone-600 font-light">{photo.caption}</p>}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function PhotosView({ photos, folders, isAdmin, onBack, onAddPhoto, onDeletePhoto }) {
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const caption = prompt('Enter a caption (optional):');
                        const folderId = prompt(`Choose folder ID or leave blank:\n${folders.map(f => `${f.name}:${f.id}`).join('\n')}`);
                        onAddPhoto(reader.result, caption || '', folderId);
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="space-y-4">
                    <div className="flex items-center justify-between">
                        <button onClick={onBack} className="text-xs text-stone-500 flex items-center gap-1">
                            <i data-lucide="arrow-left" className="w-4 h-4"></i> back
                        </button>
                        <h2 className="font-serif text-xl">photo memories</h2>
                        {isAdmin && (
                            <label className="text-xs bg-charcoal text-cream px-3 py-1.5 rounded-full cursor-pointer">
                                upload photo <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                            </label>
                        )}
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                        {photos.map(photo => (
                            <div key={photo.id} className="bg-white p-2 rounded-xl border border-stone-200 shadow-sm space-y-2 relative group">
                                <div className="aspect-square rounded-lg overflow-hidden bg-stone-100">
                                    <img src={photo.url} alt={photo.caption} className="w-full h-full object-cover" />
                                </div>
                                {photo.caption && <p className="text-xs text-stone-600 font-light">{photo.caption}</p>}
                                {isAdmin && (
                                    <button onClick={() => onDeletePhoto(photo.id)} className="absolute top-4 right-4 bg-white/80 p-1 rounded-full text-rose-600 hover:bg-white">
                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
